name: Build Fruit Fury Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android-apk:
    name: Android APK (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check toolchain and project files
        run: |
          echo '== Go =='
          go version
          echo '== Java =='
          java -version
          echo '== Gradle =='
          gradle --version
          echo '== Android SDK =='
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          sdkmanager --version
          echo '== Build script =='
          test -f go.mod
          test -f mobile/mobile.go
          test -f android/app/src/main/AndroidManifest.xml
          bash -n scripts/build-android.sh

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/build-android.sh 2>&1 | tee build.log

      - name: Verify APK exists
        run: |
          test -s dist/fruit-fury-android-debug.apk
          ls -lh dist/fruit-fury-android-debug.apk

      - name: Upload sideloadable APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Fruit-Fury-Android-Debug-APK
          path: dist/fruit-fury-android-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log if the build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Fruit-Fury-Build-Failure-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
