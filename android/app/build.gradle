plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fruitfury.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fruitfury.game'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            // Ebitengine's Go shared library is loaded by its Java host view.
            useLegacyPackaging true
        }
    }
}

dependencies {
    // Generated by scripts/build-android.sh via ebitenmobile bind.
    implementation files('libs/fruitfury.aar')
}
